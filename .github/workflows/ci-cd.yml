name: CI/CD Pipeline

on:
  push:
    branches:
      - main

env:
  IMAGE_NAME: go-api

jobs:
  build-and-deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set Docker image tag
        shell: powershell
        run: |
          $IMAGE_TAG="${{ secrets.DOCKER_USERNAME }}/go-api:latest"
          echo "IMAGE_TAG=$IMAGE_TAG" >> $env:GITHUB_ENV

      # 🔥 FIX ตรงนี้
      - name: Docker login
        shell: powershell
        run: |
          docker login -u "${{ secrets.DOCKER_USERNAME }}" -p "${{ secrets.DOCKER_TOKEN }}"

      - name: Build Docker image
        shell: powershell
        run: docker build -t $env:IMAGE_TAG ./api

      - name: Push Docker image
        shell: powershell
        run: docker push $env:IMAGE_TAG

      - name: Deploy to Kubernetes
        shell: powershell
        run: |
          kubectl set image deployment/go-api go-api=$env:IMAGE_TAG
          kubectl rollout status deployment/go-api