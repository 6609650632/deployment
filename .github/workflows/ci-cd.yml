name: CI/CD Pipeline

on:
  push:
    branches:
      - main

env:
  IMAGE_NAME: go-api

jobs:
  build-and-deploy:
    runs-on: self-hosted  

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set Docker image tag
        run: echo "IMAGE_TAG=${{ secrets.DOCKER_USERNAME }}/go-api:latest" >> $GITHUB_ENV

      - name: Docker login
        run: echo "${{ secrets.DOCKER_TOKEN }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Build Docker image
        run: docker build -t $IMAGE_TAG ./api

      - name: Push Docker image
        run: docker push $IMAGE_TAG

      - name: Deploy to Kubernetes
        run: |
          kubectl set image deployment/go-api go-api=$IMAGE_TAG
          kubectl rollout status deployment/go-api